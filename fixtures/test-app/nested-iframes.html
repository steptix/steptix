<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureBank — Wealth Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-header {
      background: #1f2937;
      color: #f9fafb;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .page-header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .page-header .subtitle {
      font-size: 13px;
      color: #9ca3af;
    }

    .dashboard-layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .summary-panel {
      width: 280px;
      background: #fff;
      border-right: 1px solid #d1d5db;
      padding: 20px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .summary-panel h2 {
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    .portfolio-stat {
      margin-bottom: 16px;
    }

    .portfolio-stat .label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 2px;
    }

    .portfolio-stat .value {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }

    .portfolio-stat .change {
      font-size: 12px;
      font-weight: 600;
    }

    .change-positive { color: #047857; }
    .change-negative { color: #dc2626; }

    .allocation-list {
      list-style: none;
      margin-top: 12px;
    }

    .allocation-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 13px;
      color: #374151;
    }

    #advisor-frame {
      flex: 1;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <div>
      <h1>Wealth Dashboard</h1>
      <div class="subtitle">Manage your portfolio and connect with your advisor</div>
    </div>
  </div>

  <div class="dashboard-layout">
    <div class="summary-panel">
      <h2>Portfolio Summary</h2>
      <div class="portfolio-stat">
        <div class="label">Total Value</div>
        <div class="value">$142,850.00</div>
        <div class="change change-positive">+2.4% this month</div>
      </div>
      <div class="portfolio-stat">
        <div class="label">Cash Available</div>
        <div class="value">$12,300.00</div>
      </div>
      <h2>Asset Allocation</h2>
      <ul class="allocation-list">
        <li class="allocation-item"><span>Equities</span><span>52%</span></li>
        <li class="allocation-item"><span>Bonds</span><span>28%</span></li>
        <li class="allocation-item"><span>Real Estate</span><span>12%</span></li>
        <li class="allocation-item"><span>Cash</span><span>8%</span></li>
      </ul>
    </div>

    <iframe id="advisor-frame" name="advisor-frame" src="/iframe/nested/advisor" title="Advisor Portal"></iframe>
  </div>
</body>
</html>
