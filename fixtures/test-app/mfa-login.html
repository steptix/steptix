<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureBank — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #1a56db;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
    }

    .logo-name {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #b91c1c;
      font-size: 14px;
    }

    .error-banner.visible { display: block; }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #111827;
      transition: border-color 0.15s;
      outline: none;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
    }

    .sign-in-btn {
      width: 100%;
      padding: 11px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
    }

    .sign-in-btn:hover { background: #1648c0; }

    /* Verifying overlay — shown after successful login, before redirect */
    .verifying-overlay {
      display: none;
      text-align: center;
      padding: 32px 0;
    }

    .verifying-overlay.visible { display: block; }

    .verifying-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .verifying-text {
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">S</div>
      <span class="logo-name">SecureBank</span>
    </div>

    <h1>Sign in</h1>
    <p class="subtitle">Welcome back. Enter your credentials to continue.</p>

    <div id="error-banner" class="error-banner" role="alert" aria-live="polite">
      Invalid email or password. Please try again.
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="sign-in-btn" id="sign-in-btn">Sign In</button>
    </form>

    <!-- Shown after successful login while "verifying account" -->
    <div id="verifying-overlay" class="verifying-overlay">
      <div class="verifying-spinner"></div>
      <div class="verifying-text">Verifying your account...</div>
    </div>
  </div>

  <script>
    /**
     * MFA-aware login page.
     *
     * Query parameters control behaviour:
     *   ?mfa=true       — always require MFA after login (default: true)
     *   ?mfa=false      — never require MFA (go straight to dashboard)
     *   ?loginDelay=N   — ms to show "Verifying your account..." spinner before redirect (default: 5000)
     *   ?mfaDelay=N     — ms before MFA form appears on mfa.html (passed through, default: 3000)
     *   ?mfaCode=N      — valid MFA code (passed through, default: 123456)
     */
    const params = new URLSearchParams(window.location.search);
    const requireMfa = params.get('mfa') !== 'false';
    const loginDelay = parseInt(params.get('loginDelay') ?? '5000', 10);
    const mfaDelay = params.get('mfaDelay') ?? '3000';
    const mfaCode = params.get('mfaCode') ?? '123456';

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBanner = document.getElementById('error-banner');

      // Validate credentials client-side (same as main login page)
      if (email === 'demo@securebank.com' && password === 'password123') {
        sessionStorage.setItem('logged-in', 'true');
        sessionStorage.setItem('user-email', email);

        // Hide the form, show "verifying" spinner
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('verifying-overlay').classList.add('visible');
        errorBanner.classList.remove('visible');

        // After a delay, redirect to either MFA or dashboard
        // This delay is the key: it simulates the slow server response that
        // causes the AI to think the page is heading to dashboard when it's
        // actually going to MFA.
        setTimeout(() => {
          if (requireMfa) {
            window.location.href = `mfa.html?delay=${mfaDelay}&code=${mfaCode}`;
          } else {
            window.location.href = 'dashboard.html';
          }
        }, loginDelay);
      } else {
        errorBanner.classList.add('visible');
        document.getElementById('password').value = '';
      }
    });
  </script>
</body>
</html>
