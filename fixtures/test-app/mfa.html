<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureBank — Verification Required</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mfa-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .shield-icon {
      width: 56px;
      height: 56px;
      background: #eff6ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #b91c1c;
      font-size: 14px;
    }

    .error-banner.visible {
      display: block;
    }

    .code-input-group {
      margin-bottom: 24px;
    }

    .code-input-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    #mfa-code {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #d1d5db;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 8px;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
    }

    #mfa-code:focus {
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
    }

    .verify-btn {
      width: 100%;
      padding: 11px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 16px;
    }

    .verify-btn:hover { background: #1648c0; }
    .verify-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .resend-link {
      font-size: 13px;
      color: #1a56db;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: none;
    }

    .resend-link:hover { text-decoration: underline; }

    /* Loading overlay shown before MFA form appears */
    .loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 40px 0;
    }

    .loading-overlay.hidden { display: none; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #6b7280;
      font-size: 14px;
    }

    .mfa-form { display: none; }
    .mfa-form.visible { display: block; }
  </style>
</head>
<body>

  <div class="mfa-card">
    <div class="shield-icon">&#128274;</div>

    <h1>Verification Required</h1>
    <p class="subtitle">We've sent a 6-digit code to your email. Enter it below to continue.</p>

    <!-- Loading state: shown initially while "sending" the code -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="spinner" aria-label="Loading"></div>
      <span class="loading-text">Sending verification code...</span>
    </div>

    <!-- MFA form: revealed after the delay -->
    <div id="mfa-form" class="mfa-form">
      <div id="error-banner" class="error-banner" role="alert" aria-live="polite">
        Invalid verification code. Please try again.
      </div>

      <div class="code-input-group">
        <label for="mfa-code">Verification code</label>
        <input type="text" id="mfa-code" name="mfa-code" maxlength="6" placeholder="000000" inputmode="numeric" autocomplete="one-time-code">
      </div>

      <button type="button" class="verify-btn" id="verify-btn" disabled>Verify Code</button>

      <button type="button" class="resend-link" id="resend-link">Resend code</button>
    </div>
  </div>

  <script>
    // Parse delay from query string: ?delay=5000 (default 3000ms)
    const params = new URLSearchParams(window.location.search);
    const delay = parseInt(params.get('delay') ?? '3000', 10);
    const validCode = params.get('code') ?? '123456';

    const codeInput = document.getElementById('mfa-code');
    const verifyBtn = document.getElementById('verify-btn');

    // Show MFA form after delay (simulates server sending the code)
    setTimeout(() => {
      document.getElementById('loading-overlay').classList.add('hidden');
      document.getElementById('mfa-form').classList.add('visible');
      codeInput.focus();
    }, delay);

    // Enable verify button when 6 digits are entered
    codeInput.addEventListener('input', () => {
      const val = codeInput.value.replace(/\D/g, '');
      codeInput.value = val;
      verifyBtn.disabled = val.length !== 6;
    });

    // Verify button
    verifyBtn.addEventListener('click', () => {
      const code = codeInput.value.trim();
      const errorBanner = document.getElementById('error-banner');

      if (code === validCode) {
        sessionStorage.setItem('mfa-verified', 'true');
        window.location.href = 'dashboard.html';
      } else {
        errorBanner.classList.add('visible');
        codeInput.value = '';
        codeInput.focus();
        verifyBtn.disabled = true;
      }
    });

    // Resend link
    document.getElementById('resend-link').addEventListener('click', () => {
      const overlay = document.getElementById('loading-overlay');
      const form = document.getElementById('mfa-form');
      overlay.classList.remove('hidden');
      form.classList.remove('visible');

      setTimeout(() => {
        overlay.classList.add('hidden');
        form.classList.add('visible');
        codeInput.value = '';
        codeInput.focus();
        verifyBtn.disabled = true;
      }, 2000);
    });
  </script>
</body>
</html>
