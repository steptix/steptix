<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureBank — Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #banner-frame {
      width: 100%;
      height: 64px;
      border: none;
      border-bottom: 1px solid #d1d5db;
      flex-shrink: 0;
    }

    .content-area {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    #sidebar-frame {
      width: 240px;
      height: 100%;
      border: none;
      border-right: 1px solid #d1d5db;
      flex-shrink: 0;
    }

    #main-frame {
      flex: 1;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="banner-frame" name="banner-frame" src="/iframe/banner" title="Navigation banner"></iframe>

  <div class="content-area">
    <iframe id="sidebar-frame" name="sidebar-frame" src="/iframe/sidebar/accounts" title="Sidebar navigation"></iframe>
    <iframe id="main-frame" name="main-frame" src="/iframe/content/accounts/overview" title="Main content"></iframe>
  </div>

  <script>
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || !data.type) return;

      if (data.type === 'banner-navigate') {
        document.getElementById('sidebar-frame').src = '/iframe/sidebar/' + data.category;
        document.getElementById('main-frame').src = '/iframe/content/' + data.category + '/' + data.defaultItem;
      }

      if (data.type === 'sidebar-navigate') {
        document.getElementById('main-frame').src = '/iframe/content/' + data.category + '/' + data.item;
      }
    });
  </script>
</body>
</html>
