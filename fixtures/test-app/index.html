<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureBank — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #1a56db;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
    }

    .logo-name {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #b91c1c;
      font-size: 14px;
    }

    .error-banner.visible {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #111827;
      transition: border-color 0.15s;
      outline: none;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
    }

    .sign-in-btn {
      width: 100%;
      padding: 11px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
    }

    .sign-in-btn:hover { background: #1648c0; }
    .sign-in-btn:active { background: #143aaa; }

    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #1a56db;
      text-decoration: none;
    }

    .forgot-link:hover { text-decoration: underline; }

    /* Cookie consent banner */
    .cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1f2937;
      color: #f9fafb;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 1000;
      font-size: 14px;
    }

    .cookie-banner.hidden { display: none; }

    .cookie-banner p { flex: 1; }

    .cookie-btn {
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .cookie-btn:hover { background: #1648c0; }

    .cookie-reject {
      background: transparent;
      border: 1px solid #6b7280;
      color: #9ca3af;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .cookie-reject:hover { border-color: #9ca3af; color: #f3f4f6; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">S</div>
      <span class="logo-name">SecureBank</span>
    </div>

    <h1>Sign in</h1>
    <p class="subtitle">Welcome back. Enter your credentials to continue.</p>

    <div id="error-banner" class="error-banner" role="alert" aria-live="polite">
      Invalid email or password. Please try again.
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="sign-in-btn" id="sign-in-btn">Sign In</button>
    </form>

    <a href="#" class="forgot-link">Forgot your password?</a>
  </div>

  <!-- Cookie consent banner (shown on first visit) -->
  <div id="cookie-banner" class="cookie-banner hidden" role="dialog" aria-label="Cookie consent">
    <p>We use cookies to improve your experience and keep you signed in. By continuing, you agree to our cookie policy.</p>
    <button class="cookie-reject" id="cookie-reject">Reject</button>
    <button class="cookie-btn" id="cookie-accept">Accept Cookies</button>
  </div>

  <script>
    // Show cookie banner on first visit
    if (!localStorage.getItem('cookie-consent')) {
      document.getElementById('cookie-banner').classList.remove('hidden');
    }

    document.getElementById('cookie-accept').addEventListener('click', function () {
      localStorage.setItem('cookie-consent', 'accepted');
      document.getElementById('cookie-banner').classList.add('hidden');
    });

    document.getElementById('cookie-reject').addEventListener('click', function () {
      localStorage.setItem('cookie-consent', 'rejected');
      document.getElementById('cookie-banner').classList.add('hidden');
    });

    // Login form handler
    // Valid credentials: demo@securebank.com / password123
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBanner = document.getElementById('error-banner');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          sessionStorage.setItem('logged-in', 'true');
          sessionStorage.setItem('user-email', email);
          window.location.href = 'dashboard.html';
        } else {
          errorBanner.classList.add('visible');
          document.getElementById('password').value = '';
        }
      } catch {
        // Fallback to client-side check if server unavailable
        if (email === 'demo@securebank.com' && password === 'password123') {
          sessionStorage.setItem('logged-in', 'true');
          sessionStorage.setItem('user-email', email);
          window.location.href = 'dashboard.html';
        } else {
          errorBanner.classList.add('visible');
          document.getElementById('password').value = '';
        }
      }
    });
  </script>
</body>
</html>
