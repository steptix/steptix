# The four unit suites. CLAUDE.md §"Unit tests pass on Windows, Linux and
# macOS" is the contract; CI covers Windows only for now (see the matrix),
# so Linux still gets checked through WSL by hand. Live and
# integration suites (VS Code instances, an AI gateway key, a real desktop)
# are deliberately not here.
name: Unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run already going for it.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not hide whether the others pass.
      fail-fast: false
      matrix:
        # Windows only for now, to stay inside the private repo's Actions
        # minutes. Linux is ubuntu-latest (1x minutes), macOS is
        # macos-latest (10x) — add them back here when the budget allows.
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runner-core/package-lock.json
            flick-vscode/package-lock.json
            steptix-vscode/package-lock.json
            fixtures/tools/package-lock.json

      # The five node_modules trees, keyed on all five lockfiles and the Node
      # version, so a run whose dependencies haven't changed skips npm ci.
      # The npm cache above only saves the downloads; npm ci still writes
      # every file, which is the slow part on Windows.
      - name: Restore node_modules
        id: nm
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            runner-core/node_modules
            fixtures/tools/node_modules
            flick-vscode/node_modules
            steptix-vscode/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'runner-core/package-lock.json', 'fixtures/tools/package-lock.json', 'flick-vscode/package-lock.json', 'steptix-vscode/package-lock.json') }}

      # Order matters: runner-core first (its `prepare` builds the dist/ that
      # steptix-vscode's file: dep links to), and the root before
      # fixtures/tools (its `steptix` dep is file:../..).
      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          npm ci
          npm ci --prefix runner-core
          npm ci --prefix fixtures/tools
          npm ci --prefix flick-vscode
          npm ci --prefix steptix-vscode

      # The two file: deps are junctions to ../runner-core and to the repo
      # root. They stay out of the cache: archiving one would store a link
      # to this runner's checkout, or a copy of what it points at — for
      # fixtures/tools, the whole repo. Remove only the links, save, and
      # make them fresh below on every run.
      - name: Unlink file deps
        if: steps.nm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          [System.IO.Directory]::Delete("$PWD/steptix-vscode/node_modules/steptix-runner-core", $false)
          [System.IO.Directory]::Delete("$PWD/fixtures/tools/node_modules/steptix", $false)

      - name: Save node_modules
        if: steps.nm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            runner-core/node_modules
            fixtures/tools/node_modules
            flick-vscode/node_modules
            steptix-vscode/node_modules
          key: ${{ steps.nm.outputs.cache-primary-key }}

      - name: Link file deps
        shell: pwsh
        run: |
          New-Item -ItemType Junction -Path "$PWD/steptix-vscode/node_modules/steptix-runner-core" -Target "$PWD/runner-core" | Out-Null
          New-Item -ItemType Junction -Path "$PWD/fixtures/tools/node_modules/steptix" -Target "$PWD" | Out-Null

      # npm ci's `prepare` built runner-core's dist/; on a cache hit nothing did.
      - name: Build runner-core
        if: steps.nm.outputs.cache-hit == 'true'
        run: npm run build --prefix runner-core

      # The root suite's real-browser tests launch Playwright's Chromium.
      # Cached per Playwright version so a run doesn't download it again;
      # on a hit, `playwright install` finds it present and does nothing.
      # The path is Windows'; Linux's is ~/.cache/ms-playwright, and Linux
      # also needs `--with-deps` on the install for its system packages.
      - name: Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Each suite runs even if an earlier one failed, so one run reports all
      # four. Several suites test dist/, so something must build it first —
      # but only once. The root's `npm test` keeps its pretest build of the
      # root dist/, and runner-core's dist/ was built by its `prepare` during
      # Install. runner-core's and steptix-vscode's pretests would only
      # rebuild those two (about 40 s), so they run with --ignore-scripts,
      # which skips pre/post scripts but still runs `test`. That makes them
      # depend on the Root step having built: if the root fails to compile,
      # steptix-vscode fails too, and the root's error is the one to read.
      #
      # Vitest starts CPUs - 1 workers outside watch mode, which is one on a
      # 2-vCPU hosted runner: every file in turn. The root suite mostly waits
      # on Chromium and child processes, so more workers than cores still pay.
      - name: Root
        run: npm test -- --maxWorkers=6
      - name: runner-core
        if: ${{ !cancelled() }}
        run: npm test --ignore-scripts --prefix runner-core
      - name: flick-vscode
        if: ${{ !cancelled() }}
        run: npm test --prefix flick-vscode
      - name: steptix-vscode
        if: ${{ !cancelled() }}
        run: npm test --ignore-scripts --prefix steptix-vscode
